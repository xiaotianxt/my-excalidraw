name: Desktop Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      # No signing/notarization credentials are configured for public CI builds.
      # Release notes disclose this; local developer signing remains unchanged.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!=="v"+p.version) throw Error("Tag/package version mismatch")'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - name: Embedded PNG/SVG and DPI round-trip
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        run: npm run test:images
      - name: Package desktop installers
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - name: Verify complete release and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          files=(
            "My-Excalidraw-${version}-mac-arm64.dmg"
            "My-Excalidraw-${version}-mac-x64.dmg"
            "My-Excalidraw-${version}-win-x64.exe"
            "My-Excalidraw-${version}-linux-x64.AppImage"
            "My-Excalidraw-${version}-linux-x64.deb"
          )
          for file in "${files[@]}"; do test -s "installers/$file"; done
          (cd installers && sha256sum "${files[@]}" > SHA256SUMS.txt)
          # Keep the release a draft until every asset has uploaded successfully.
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > release-state; then
            test "$(< release-state)" = true || { echo 'Refusing to replace a published release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --target "$GITHUB_SHA" --draft --title "$GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          fi
          gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
